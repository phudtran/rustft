[package]
name = "rustft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rustft"


[dependencies]
ndarray = "0.16.1"
rayon = { version = "1", optional = true }
realfft = "3.5"
rustfft = "6.2"
transpose = "0.2"

[build-dependencies]
# Only used by the optional `pocketfft` feature; the build script exits early without it.
cc = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "stft"
harness = false

[features]
# Fan the per-frame FFTs out across cores with rayon.
parallel = ["dep:rayon"]
# Swap rustfft for a vendored pocketfft, the FFT PyTorch itself uses on CPU. Makes the
# output bit-identical to torch.stft / torch.istft, at the cost of a C++ toolchain at
# build time. pocketfft is BSD-3-Clause; its notice is in the vendored header.
pocketfft = []
