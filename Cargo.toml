[workspace]
members = [
    "rustft",
    "benchmarks",
    "example",
    "conformance",
]
# `benchmarks` is a Python extension module: it resolves the interpreter's symbols at
# load time, so it links under `maturin develop` but not under a bare `cargo build`.
# Keeping it out of the default set lets `cargo build`, `cargo test` and `cargo bench`
# work from the repository root; see benchmarks/README.md to build it.
default-members = [
    "rustft",
    "example",
    "conformance",
]
resolver = "2"

[workspace.package]
# `name` is not workspace-inheritable; each member declares its own.
version = "0.1.0"
edition = "2021"
# rayon 1.12 is the highest floor among the dependencies.
rust-version = "1.80"
# The crate's own code is MIT OR Apache-2.0. It also ships a vendored pocketfft
# (BSD-3-Clause) and a port of SLEEF's cosf_u1 (BSL-1.0).
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND BSL-1.0"
description = "STFT and ISTFT matching PyTorch bit for bit"
readme = "README.md"
homepage = "https://github.com/phudtran/rustft"
repository = "https://github.com/phudtran/rustft"

categories = ["multimedia::audio", "mathematics", "algorithms", "multimedia"]
keywords = ["audio", "ISTFT", "STFT", "spectrogram", "signal_processing"]

[workspace.dependencies]
rustft = { path = "./rustft", package = "rustft"}
benchmarks = { path = "./benchmarks", package = "benchmarks" }
example = { path = "./example", package = "example"}

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = 3     # Optimize for speed; this is a numerics library
strip = true      # Remove debug symbols
rpath = true

[profile.release-with-debug]
inherits = "release"
debug = true