[package]
name = "benchmarks"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[lib]
name = "rustft"
crate-type = ["cdylib"]

[dependencies]
# The point of these bindings is to measure the code in this repository. Pulling
# rustft from crates.io instead would benchmark whatever was last published.
rustft = { path = "../rustft", features = ["parallel"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
